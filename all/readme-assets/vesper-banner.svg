<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Vesper — Local interface, cloud intelligence</title>
  <desc id="desc">Animated dark banner with a glowing voice orb and audio waveform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05050a"/>
      <stop offset="0.55" stop-color="#0b0914"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="orb" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.13" stop-color="#d8b4fe"/>
      <stop offset="0.48" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#164e63"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="28" fill="url(#grid)"/>
  <circle cx="1028" cy="55" r="260" fill="#7c3aed" opacity=".09" filter="url(#soft)"/>
  <circle cx="1130" cy="330" r="210" fill="#0891b2" opacity=".08" filter="url(#soft)"/>

  <g transform="translate(88 85)">
    <rect x="0" y="0" width="54" height="54" rx="15" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".13"/>
    <path d="M18 28c4-10 14-15 24-11-2 12-10 20-24 22 5-3 8-6 10-10-4 1-7 0-10-1Z" fill="none" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="112" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="700" letter-spacing="13">VESPER</text>
    <rect x="0" y="137" width="478" height="2" rx="1" fill="url(#accent)" opacity=".85"/>
    <text x="2" y="180" fill="#bbb8c9" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="4">VOICE-FIRST AI ASSISTANT</text>
    <text x="2" y="224" fill="#777487" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="2">LOCAL INTERFACE  •  CLOUD INTELLIGENCE</text>
  </g>

  <g transform="translate(944 202)">
    <circle r="118" fill="none" stroke="#a78bfa" stroke-opacity=".17" stroke-width="2">
      <animate attributeName="r" values="86;124;86" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".4;.05;.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="82" fill="none" stroke="#22d3ee" stroke-opacity=".22" stroke-width="1.5">
      <animate attributeName="r" values="72;94;72" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".15;.55;.15" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="58" fill="url(#orb)" opacity=".96" filter="url(#glow)">
      <animate attributeName="r" values="54;62;54" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-17" cy="-18" r="15" fill="#ffffff" opacity=".62" filter="url(#glow)"/>
  </g>

  <g transform="translate(690 330)" fill="url(#accent)" opacity=".8">
    <rect x="0" y="-8" width="5" height="16" rx="2.5"><animate attributeName="height" values="16;42;16" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-8;-21;-8" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="16" y="-15" width="5" height="30" rx="2.5"><animate attributeName="height" values="30;12;30" dur=".8s" repeatCount="indefinite"/><animate attributeName="y" values="-15;-6;-15" dur=".8s" repeatCount="indefinite"/></rect>
    <rect x="32" y="-23" width="5" height="46" rx="2.5"><animate attributeName="height" values="46;22;46" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="-23;-11;-23" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="48" y="-11" width="5" height="22" rx="2.5"><animate attributeName="height" values="22;50;22" dur=".95s" repeatCount="indefinite"/><animate attributeName="y" values="-11;-25;-11" dur=".95s" repeatCount="indefinite"/></rect>
    <rect x="64" y="-18" width="5" height="36" rx="2.5"><animate attributeName="height" values="36;16;36" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="-18;-8;-18" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="80" y="-7" width="5" height="14" rx="2.5"><animate attributeName="height" values="14;38;14" dur=".75s" repeatCount="indefinite"/><animate attributeName="y" values="-7;-19;-7" dur=".75s" repeatCount="indefinite"/></rect>
  </g>

  <rect x="1" y="1" width="1198" height="398" rx="27" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="2"/>
</svg>
